
Dataset:
  - task: classification
  - img_dir:  my_folder
  - csv_file: my_file.csv
  - split:    train-test
  - ratios:
      train_ratio: 0.8
      test_ratio: 0.2

  - batchsize: 10

  - train_transforms:
      - resize:
        width: 256
        height: 256
        p: 1

      - horizontalFlip:
        p: 0.5

      - verticalFlip:
        p: 0.5

      - centralCrop:
        width: 256
        height: 256
        p: 1

      - rotate:
        minAngle: 25
        maxAngle: 90
        p: 0.5

      - normalize:
          mean: [0.485, 0.46, 0.406]
          std:  [0.229, 0.224, 0.225]


  - test_transforms:
      - resize:
        width: 256
        height: 256
        p: 1

      - normalize:
          mean: [0.485, 0.46, 0.406]
          std:  [0.229, 0.224, 0.225]
